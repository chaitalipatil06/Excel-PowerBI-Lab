<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lumi's Data Lab: Excel + Power BI</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>:root{--ink:#33304a;--muted:#77728f;--line:#e9e5f3;--card:#fff;--bg:#f7f6fb;--mint:#9ad9c1;--mint2:#2f9e77;--pink:#f7b6cc;--lav:#d9cff7;--lav2:#7d6bd8;--butter:#f8d77a;--sky:#a9cdf5;--coral:#f29b9b;--r:20px;--shadow:0 8px 24px -14px rgba(70,50,130,.35)}
*{box-sizing:border-box}
body{margin:0;font-family:'Lexend','Nunito',system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:16px;line-height:1.55;min-height:100vh}
body.big{font-size:18.5px}
h1,h2,h3{font-family:'Lexend',sans-serif;line-height:1.2;margin:.2em 0 .4em}
h1{font-size:2em}h2{font-size:1.4em}
code,.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:.88em}
code{background:#f1edfb;padding:1px 6px;border-radius:6px;color:#5b3fc4}
a{color:var(--lav2)}
button{font-family:inherit;cursor:pointer;color:inherit}
.muted{color:var(--muted)}.small{font-size:.85em}.center{text-align:center}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0}.row.center{justify-content:center}.row.between{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:10px;align-items:stretch}
/* top bar */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 22px;background:rgba(255,255,255,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{font-weight:800;font-size:1.25em;text-decoration:none;color:var(--ink);display:flex;align-items:center;gap:8px}
.brand i{font-style:normal;background:linear-gradient(90deg,#2f9e77,#7d6bd8,#c99a06);-webkit-background-clip:text;background-clip:text;color:transparent}
.stats{margin-left:auto;display:flex;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);padding:5px 12px;border-radius:999px;font-weight:700;font-size:.9em}
.iconbtn{border:1px solid var(--line);background:#fff;width:38px;height:38px;border-radius:12px;font-size:1em;flex:none}
.iconbtn:hover{background:#f4f1fd}
body.focus .topbar{display:none}
main{max-width:1060px;margin:0 auto;padding:24px 18px 70px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:22px 24px;margin:16px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:14px;padding:12px 22px;font-weight:700;font-size:1em;background:var(--lav2);color:#fff;text-decoration:none;box-shadow:0 4px 0 #5a4ab0;transition:transform .1s}
.btn:hover{transform:translateY(-1px)}.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #5a4ab0}
.btn.mint{background:var(--mint2);box-shadow:0 4px 0 #1f7457}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:0 3px 0 #e2ddef}
.btn.small{padding:7px 14px;font-size:.88em;border-radius:11px}
.btn.big{padding:16px 26px;font-size:1.1em;flex-wrap:wrap}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.view{animation:in .35s ease both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* home */
.hero{display:grid;grid-template-columns:150px 1fr 180px;gap:22px;align-items:center;background:linear-gradient(120deg,#fff,#f6f2ff 60%,#effaf5)}
.hero h1{margin:4px 0}.lead{font-size:1.08em}
.lumi{width:100%;max-width:150px;animation:bob 4s ease-in-out infinite}.lumi.sm{width:84px}
@keyframes bob{50%{transform:translateY(-6px)}}
.lumi .eye{animation:blink 5s infinite;transform-box:fill-box;transform-origin:center}@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.ring{text-align:center;position:relative;width:180px;margin:0 auto}.ring svg{width:130px;height:130px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10}.ring .bg{stroke:#eee9f8}.ring .fg{stroke:var(--mint2);stroke-linecap:round;transition:stroke-dashoffset 1s}
.ring>div{position:absolute;top:38px;left:0;right:0;display:flex;flex-direction:column}.ring b{font-size:1.5em}.ring span{font-size:.75em;color:var(--muted)}
.ring select{margin-top:6px;border:1px solid var(--line);border-radius:10px;padding:4px;font-family:inherit;font-size:.8em;max-width:170px}
.tracks{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.track{border-top:8px solid var(--tc)}.th{display:flex;justify-content:space-between;align-items:center}
.lessons{list-style:none;padding:0;margin:12px 0 0}
.lessons a{display:grid;grid-template-columns:38px 1fr 70px;gap:10px;align-items:center;padding:9px 10px;border-radius:14px;text-decoration:none;color:var(--ink)}
.lessons a:hover{background:#f7f5fc}
.lessons .no{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--tc);font-weight:800}
.lessons .tt{display:flex;flex-direction:column;line-height:1.25}
.lessons li.dn .no{background:var(--ta);color:#fff}.lessons li.lk{opacity:.5}
.mini{height:8px;background:#f0edf7;border-radius:9px;overflow:hidden}.mini i{display:block;height:100%;background:var(--ta);border-radius:9px}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.game{display:flex;flex-direction:column;gap:2px;padding:14px;border-radius:16px;border:1px solid var(--line);text-decoration:none;color:var(--ink);background:#fffdf3}
.game .gi{font-size:1.6em}.game.lk{opacity:.5;background:#fafafa}.game.won{background:#effaf5}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}.feat{padding-left:18px}.feat li{margin:4px 0}
/* player */
.player{max-width:980px;margin:0 auto}
.p-top{display:flex;align-items:center;gap:12px;padding:6px 0 12px;position:sticky;top:0;background:var(--bg);z-index:10}
.p-title{display:flex;flex-direction:column;line-height:1.2;min-width:150px}
.segs{flex:1;display:flex;gap:5px}.segs span{flex:1;height:10px;border-radius:9px;background:#e7e2f3;transition:background .4s}
.segs span.done{background:var(--mint2)}.segs span.cur{background:var(--lav2)}
.timer{cursor:pointer;font-variant-numeric:tabular-nums;min-width:88px;justify-content:center}.timer.low{background:#fff4e0}
.step{min-height:320px;padding:28px 32px}
.step h2{font-size:1.55em}
.step .lead{max-width:760px}
.task{background:#f6f3ff;border-left:5px solid var(--lav2);padding:10px 14px;border-radius:10px}
.tip{background:#fff8e1;border-radius:12px;padding:10px 14px;margin-top:12px}
.visual{margin:10px 0 16px;display:flex;justify-content:center}
.feedback{min-height:28px;margin:10px 4px;font-weight:700;border-radius:14px;padding:0 4px}
.feedback.ok{color:#1f7457;background:#eaf8f1;padding:12px 16px;animation:pop .4s}.feedback.no{color:#9b3b3b;background:#fdf0f0;padding:12px 16px}.feedback.hint{color:#6a5300;background:#fff8e1;padding:12px 16px}
.p-bottom{display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:18px 0 10px}
.p-bottom .mid{display:flex;gap:8px}
.celebrate{animation:pop .45s}.wiggle{animation:shake .4s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.02)}100%{transform:scale(1)}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
/* quiz / order */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.opt{text-align:left;border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px 14px;font-weight:600;font-size:1em;display:flex;gap:10px;align-items:center}
.opt .k{width:26px;height:26px;border-radius:8px;background:#f1edfb;display:grid;place-items:center;font-weight:800;flex:none;font-size:.85em}
.opt:hover{border-color:var(--lav2)}.opt.right{background:#eaf8f1;border-color:var(--mint2)}.opt.wrong{background:#fdf0f0;border-color:var(--coral);animation:shake .4s}
.why{margin-top:12px;font-weight:600}
.built{background:#f6f3ff;border-radius:14px;min-height:48px;padding:10px 10px 10px 34px;margin:12px 0}.built li{animation:in .3s;font-weight:700}
.tokens{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.token{border:2px solid var(--lav);background:#fff;border-radius:12px;padding:9px 14px;font-weight:700}.token:hover{border-color:var(--lav2)}.token.used{opacity:.2;pointer-events:none}.shake{animation:shake .4s;border-color:var(--coral)!important}
.realist{list-style:none;padding:0}.realist li{margin:8px 0}.realist label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:1.03em}.realist input{width:20px;height:20px;margin-top:3px;accent-color:var(--mint2)}
.files{display:flex;gap:8px;flex-wrap:wrap}
/* demos */
.demo-grid{display:grid;grid-template-columns:30px repeat(3,70px);gap:2px;font-family:'JetBrains Mono'}
.demo-grid b{background:#f1edfb;text-align:center;padding:4px;font-size:.8em}.demo-grid span{background:#fff;border:1px solid var(--line);height:30px;display:grid;place-items:center}.demo-grid .hot{background:#eaf8f1;border:2px solid var(--mint2);font-weight:800}
.demo-fx{text-align:center;font-size:1.1em}.cell{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:6px 14px;background:#fff;font-weight:700}.cell.hot{background:#eaf8f1;border-color:var(--mint2)}
.lock{background:#fff1c9;border-radius:6px;padding:0 4px}
.demo-fill{position:relative;display:flex;flex-direction:column;gap:4px;padding:10px 20px;border:1px dashed var(--lav2);border-radius:12px}.fade1{opacity:.75}.fade2{opacity:.5}.fade3{opacity:.3}.demo-fill .arrow{position:absolute;right:-28px;top:40%;font-size:1.4em;animation:bob 1.5s infinite}
.demo-if{display:grid;grid-template-columns:auto auto;gap:6px 16px;text-align:center}.demo-if .q{grid-column:1/3;background:#f1edfb;border-radius:10px;padding:6px 14px;font-weight:700}.demo-if .yes{background:#eaf8f1;border-radius:10px;padding:6px}.demo-if .no{background:#fdf0f0;border-radius:10px;padding:6px}
.demo-cf{display:flex;gap:6px}.demo-cf span{border:1px solid var(--line);padding:6px 12px;border-radius:8px;background:#fff}.demo-cf .g{background:var(--mint);font-weight:800}
.demo-pivot{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:320px}.demo-pivot div{border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;background:#fff}.demo-pivot span{background:#f1edfb;border-radius:6px;padding:2px 8px;margin-top:4px;font-size:.85em}
.demo-charts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.demo-charts div{display:flex;flex-direction:column;align-items:center;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:1.3em;background:#fff}.demo-charts b{font-size:.6em}.demo-charts div{font-size:1.4em}.demo-charts div>b+*{font-size:.5em}
.demo-pbi{display:flex;gap:6px;align-items:flex-end}.demo-pbi span{width:22px;background:var(--butter);border-radius:5px}.demo-pbi b{margin-left:10px}
.demo-ui{display:grid;grid-template-columns:40px 1fr 120px;gap:6px;width:min(420px,100%);height:130px}.demo-ui .side{background:#f1edfb;border-radius:8px;text-align:center;padding-top:8px;line-height:1.9}.demo-ui .canvas{border:2px dashed var(--line);border-radius:8px;display:grid;place-items:center;color:var(--muted)}.demo-ui .panes{display:flex;flex-direction:column;gap:4px}.demo-ui .panes span{background:#fff8e1;border-radius:6px;padding:4px;font-size:.75em;text-align:center}
.demo-steps{display:flex;flex-direction:column;gap:4px;border:1px solid var(--line);border-radius:12px;padding:10px 16px;background:#fff}.demo-steps span{background:#f6f3ff;border-radius:6px;padding:2px 10px;font-size:.9em}
.demo-star{display:grid;grid-template-columns:repeat(3,auto);gap:8px 14px;align-items:center;justify-items:center}.demo-star span{padding:8px 14px;border-radius:12px;font-weight:700}.demo-star .d{background:#fff1c9}.demo-star .f{background:var(--mint);grid-row:2;grid-column:2}.demo-star span:nth-child(1){grid-column:1}.demo-star span:nth-child(2){grid-column:3;grid-row:1}.demo-star span:nth-child(4){grid-column:2;grid-row:3}
.demo-ctx{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;width:300px}.demo-ctx div{display:grid;grid-template-columns:1fr 1fr;padding:6px 12px;border-top:1px solid var(--line)}.demo-ctx div:first-child{background:#f1edfb;border:0}.demo-ctx span:last-child{color:var(--lav2);font-size:.85em}
.demo-layout{display:grid;grid-template-columns:repeat(3,70px);gap:6px}.demo-layout .k{background:var(--butter);border-radius:8px;padding:8px;text-align:center;font-weight:700;font-size:.8em}.demo-layout .c{background:#e8f4ff;border-radius:8px;height:60px;display:grid;place-items:center;font-size:.8em}.demo-layout .c:last-child{grid-column:span 2}
/* excel grid */
.xl{border:1px solid #cfe8dc;border-radius:14px;overflow:hidden;margin-top:14px;background:#fff}
.xl-bar{display:flex;align-items:center;gap:8px;padding:6px 8px;background:#f3faf6;border-bottom:1px solid #d7ece1}
.namebox{min-width:70px;font-family:'JetBrains Mono';font-weight:700;background:#fff;border:1px solid #d7ece1;border-radius:6px;padding:4px 8px;font-size:.85em}
.fx{font-style:italic;color:var(--mint2);font-weight:800}
.fxin{flex:1;border:1px solid #d7ece1;border-radius:6px;padding:7px 10px;font-family:'JetBrains Mono';font-size:.92em;outline:none}.fxin:focus{border-color:var(--mint2);box-shadow:0 0 0 3px #d6f1e5}
.xl-tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:6px 8px;border-bottom:1px solid #eef5f1}
.tb{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 10px;font-weight:700;font-size:.85em}.tb:hover{background:#f3faf6}.tb:disabled{opacity:.4}
.xl-wrap{overflow:auto;outline:none;max-height:420px}.xl-wrap:focus{box-shadow:inset 0 0 0 2px #bfe6d4}
.xl-grid{border-collapse:collapse;font-size:.92em;user-select:none}
.xl-grid th{background:#f5f7f6;color:#7c8a83;font-weight:600;font-size:.82em;padding:3px 6px;border:1px solid #e3ebe7;min-width:34px}
.xl-grid td{border:1px solid #e3ebe7;padding:5px 8px;min-width:96px;max-width:170px;height:30px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:cell}
.xl-grid td.num{text-align:right;font-variant-numeric:tabular-nums}.xl-grid td.hdr{font-weight:700;background:#fbfdfc}
.xl-grid td.f{color:#1f6b52}.xl-grid td.err{color:#c0392b;font-weight:700}
.xl-grid td.sel{background:#e3f5ec}.xl-grid td.act{outline:2px solid var(--mint2);outline-offset:-2px;background:#fff}
/* table ops */
.tt-tools{display:flex;gap:8px;margin:12px 0 6px}.cfpanel{background:#fffdf3;border:1px solid #f3e6b5;border-radius:12px;padding:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cfpanel select,.smallin{border:1px solid var(--line);border-radius:8px;padding:5px;font-family:inherit}.smallin{width:80px}
.sw{width:24px;height:24px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}.sw.on{box-shadow:0 0 0 2px var(--ink)}
table.tt,table.pt,table.pqt,table.vt{border-collapse:collapse;width:100%;font-size:.92em;background:#fff}
.tt th,.pt th,.pqt th,.vt th{background:#f6f3ff;text-align:left;padding:7px 10px;position:relative}.tt td,.pt td,.pqt td,.vt td{padding:6px 10px;border-top:1px solid var(--line)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.hdrbtn{border:none;background:none;font-weight:800;padding:0}
.colmenu{position:absolute;top:100%;left:0;z-index:5;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:8px;min-width:200px;font-weight:400}
.colmenu>button{display:block;width:100%;text-align:left;border:none;background:none;padding:6px 8px;border-radius:8px}.colmenu>button:hover{background:#f6f3ff}
.colmenu .fl{max-height:160px;overflow:auto;display:flex;flex-direction:column;padding:4px 8px}
/* pivot */
.pv{display:grid;grid-template-columns:220px 1fr;grid-template-rows:auto 1fr;gap:12px;margin-top:12px}
.pv-fields{grid-row:1/3;border:1px solid var(--line);border-radius:14px;padding:10px;background:#fbfaff}
.pf{display:flex;justify-content:space-between;align-items:center;padding:4px 2px;border-bottom:1px dashed var(--line)}
.pfb button{border:1px solid var(--line);background:#fff;border-radius:7px;width:28px;height:26px;font-weight:800;margin-left:2px;font-size:.8em}.pfb button:hover{background:var(--lav);}
.pv-zones{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.zone{border:2px dashed var(--line);border-radius:12px;padding:8px;min-height:60px;display:flex;flex-direction:column;gap:4px}.zone i{color:var(--muted);font-size:.85em}.zone select{border:1px solid var(--line);border-radius:6px;font-family:inherit}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--lav);border-radius:9px;padding:3px 8px;font-weight:700;font-size:.88em;margin:2px}.chip button{border:none;background:none;font-size:.8em;padding:0}
.chip.good{background:#d8f2e6}.chip.bad{background:#fbdcdc}
.pt .gt td{font-weight:800;background:#faf8ff}.pt .tot{font-weight:700}
.empty{color:var(--muted);text-align:center;padding:30px;border:2px dashed var(--line);border-radius:14px}
/* charts */
.chartbox{display:grid;grid-template-columns:220px 1fr;gap:14px;margin-top:12px}.ch-tools{display:flex;flex-direction:column;gap:12px}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}.seg button,.vtypes button,.flist button,.slicer button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 10px;font-weight:600;font-size:.88em}
.seg button.on,.vtypes button.on,.flist button.on,.slicer button.on{background:var(--lav2);color:#fff;border-color:var(--lav2)}
svg.chart{width:100%;height:auto}.chart .gl{stroke:#eee9f6}.chart .tl{font-size:13px;fill:#6f6a86;font-family:Lexend,sans-serif}
.grow{transform-box:fill-box;transform-origin:bottom;animation:grow .6s ease}@keyframes grow{from{transform:scaleY(0)}}
.draw{stroke-dasharray:2000;stroke-dashoffset:2000;animation:dash 1.2s ease forwards}@keyframes dash{to{stroke-dashoffset:0}}
/* power query */
.pq{display:grid;grid-template-columns:1fr 230px;gap:12px;margin-top:12px}
.pq-tools{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}.pq-tools .grp{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pq-tools button{border:1px solid #f0dfa0;background:#fffdf3;border-radius:9px;padding:6px 10px;font-weight:700;font-size:.85em}.pq-tools button:disabled{opacity:.35}
.pq-grid{overflow:auto;border:1px solid var(--line);border-radius:12px}
.pqt th{cursor:pointer;white-space:nowrap}.pqt th.on{background:#fff1c9;box-shadow:inset 0 -3px 0 var(--butter)}.ty{font-size:.7em;color:var(--muted);font-family:'JetBrains Mono'}
.pqt td{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:.85em}.pqt td.err{color:#c0392b;background:#fdf0f0}.pqt td.blank{background:#fafafa}
.pq-side{border:1px solid var(--line);border-radius:12px;padding:10px;background:#fbfaff}
.goals,.steps{padding-left:0;list-style:none;font-size:.9em}.goals li{padding:3px 0}.goals li.ok{color:var(--mint2);font-weight:700}
.steps li{display:flex;justify-content:space-between;background:#fff;border:1px solid var(--line);border-radius:8px;padding:4px 8px;margin:3px 0}.steps li.src{color:var(--muted)}.steps button{border:none;background:none}
/* model */
.mv{position:relative;height:430px;border:1px solid var(--line);border-radius:14px;background:repeating-linear-gradient(0deg,#fbfaff 0 23px,#f3f0fb 23px 24px);margin-top:12px}
.mv-lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.mv-lines .tl{font-size:13px;font-weight:800;fill:#5a4ab0}
.mt{position:absolute;width:24%;background:#fff;border:2px solid #f0dfa0;border-radius:12px;box-shadow:var(--shadow);overflow:hidden}.mt.fact{border-color:var(--mint2)}
.mt b{display:block;background:#fff8e1;padding:6px 10px}.mt.fact b{background:#eaf8f1}
.mt button{display:block;width:100%;text-align:left;border:none;border-top:1px solid #f4f1fa;background:#fff;padding:4px 10px;font-size:.85em}.mt button:hover{background:#f6f3ff}.mt button.pend{background:var(--lav2);color:#fff}
.rels{margin-top:8px}
/* dax */
.dax{display:grid;grid-template-columns:1fr 220px;gap:12px;margin-top:12px}
.dax-bar{display:flex;gap:8px;align-items:flex-start;border:1px solid #f0dfa0;border-radius:12px;padding:8px;background:#fffdf3}

<script>// ===== Mini spreadsheet engine (a practical subset of Excel) =====
const XL = (() => {
  const ERR = { NAME:'#NAME?', DIV:'#DIV/0!', NA:'#N/A', VAL:'#VALUE!', REF:'#REF!', CIRC:'#CIRC!' };
  const isErr = v => typeof v === 'string' && v[0] === '#' && Object.values(ERR).includes(v);
  class XErr extends Error { constructor(code){ super(code); this.code = code; } }
  const colToNum = c => c.split('').reduce((n, ch) => n*26 + ch.charCodeAt(0) - 64, 0);
  const numToCol = n => { let s = ''; while(n > 0){ const m = (n-1) % 26; s = String.fromCharCode(65+m) + s; n = Math.floor((n-1)/26); } return s; };
  const parseRef = r => { const m = /^\$?([A-Z]+)\$?(\d+)$/.exec(r.toUpperCase()); return m ? { c: colToNum(m[1]), r: +m[2] } : null; };
  const addr = (c, r) => numToCol(c) + r;

  // ---- tokenizer ----
  function tokenize(src){
    const t = []; let i = 0;
    while(i < src.length){
      const ch = src[i];
      if(/\s/.test(ch)){ i++; continue; }
      if(ch === '"'){ let j = i+1, s = ''; while(j < src.length){ if(src[j] === '"'){ if(src[j+1] === '"'){ s += '"'; j += 2; continue; } break; } s += src[j++]; } if(j >= src.length) throw new XErr(ERR.VAL); t.push({k:'str', v:s}); i = j+1; continue; }

      if((m = /^\$?[A-Za-z]{1,3}\$?\d+(:\$?[A-Za-z]{1,3}\$?\d+)?/.exec(src.slice(i))) && !/^[A-Za-z]+\(/.test(src.slice(i))){ t.push({k: m[1] ? 'range' : 'ref', v: m[0].toUpperCase()}); i += m[0].length; continue; }
      if((m = /^\d+(\.\d+)?%?/.exec(src.slice(i)))){ let v = parseFloat(m[0]); if(m[0].endsWith('%')) v /= 100; t.push({k:'num', v}); i += m[0].length; continue; }
      if((m = /^[A-Za-z_][A-Za-z0-9_.]*/.exec(src.slice(i)))){ const u = m[0].toUpperCase(); if(u === 'TRUE' || u === 'FALSE') t.push({k:'bool', v: u === 'TRUE'}); else t.push({k:'name', v:u}); i += m[0].length; continue; }
      if((m = /^(<=|>=|<>)/.exec(src.slice(i)))){ t.push({k:'op', v:m[0]}); i += 2; continue; }
      if('+-*/^&=<>(),:'.includes(ch)){ t.push({k: ch === '(' || ch === ')' || ch === ',' ? ch : 'op', v: ch}); i++; continue; }
      if(ch === ';'){ t.push({k:',', v:','}); i++; continue; }
      throw new XErr(ERR.NAME);
    }
    return t;
  }
  // ---- parser (precedence: comparison < & < +- < */ < ^ < unary) ----
  function parse(src){
    const t = tokenize(src); let p = 0;
    const peek = () => t[p], next = () => t[p++];
    const expect = k => { const x = next(); if(!x || x.k !== k) throw new XErr(ERR.VAL); return x; };
    function cmp(){ let l = cat(); while(peek() && peek().k === 'op' && ['=','<>','<','>','<=','>='].includes(peek().v)){ const o = next().v; l = {t:'bin', o, l, r:cat()}; } return l; }
    function cat(){ let l = add(); while(peek() && peek().k === 'op' && peek().v === '&'){ next(); l = {t:'bin', o:'&', l, r:add()}; } return l; }
    function add(){ let l = mul(); while(peek() && peek().k === 'op' && '+-'.includes(peek().v)){ const o = next().v; l = {t:'bin', o, l, r:mul()}; } return l; }
    function mul(){ let l = pow(); while(peek() && peek().k === 'op' && '*/'.includes(peek().v)){ const o = next().v; l = {t:'bin', o, l, r:pow()}; } return l; }
    function pow(){ let l = un(); while(peek() && peek().k === 'op' && peek().v === '^'){ next(); l = {t:'bin', o:'^', l, r:un()}; } return l; }
    function un(){ if(peek() && peek().k === 'op' && (peek().v === '-' || peek().v === '+')){ const o = next().v; const e = un(); return o === '-' ? {t:'neg', e} : e; } return prim(); }
    function prim(){
      const x = next(); if(!x) throw new XErr(ERR.VAL);
      if(x.k === 'num') return {t:'num', v:x.v};
      if(x.k === 'str') return {t:'str', v:x.v};
      if(x.k === 'bool') return {t:'bool', v:x.v};
      if(x.k === 'ref') return {t:'ref', v:x.v};
      if(x.k === 'range') return {t:'range', v:x.v};
      if(x.k === '('){ const e = cmp(); expect(')'); return e; }
      if(x.k === 'name'){
        if(peek() && peek().k === '('){ next(); const args = []; if(peek() && peek().k === ')'){ next(); return {t:'fn', n:x.v, args}; }
          while(true){ if(peek() && (peek().k === ',' || peek().k === ')')) args.push({t:'blank'}); else args.push(cmp()); const s = next(); if(!s) throw new XErr(ERR.VAL); if(s.k === ')') break; if(s.k !== ',') throw new XErr(ERR.VAL); }
          return {t:'fn', n:x.v, args}; }
        return {t:'name', v:x.v};
      }
      throw new XErr(ERR.VAL);
    }
    const e = cmp(); if(p < t.length) throw new XErr(ERR.VAL); return e;
  }

  // ---- dates: ISO text <-> Excel serial ----
  const ISO = /^(\d{4})-(\d{2})-(\d{2})$/;
  const isoToSerial = s => { const m = ISO.exec(s); return Math.round((Date.UTC(+m[1], +m[2]-1, +m[3]) - Date.UTC(1899,11,30)) / 864e5); };
  const serialToIso = n => new Date(Date.UTC(1899,11,30) + Math.round(n)*864e5).toISOString().slice(0,10);
  // ---- values ----
  const num = v => { if(v === '' || v === null || v === undefined) return 0; if(typeof v === 'boolean') return v ? 1 : 0; if(typeof v === 'number') return v; if(isErr(v)) throw new XErr(v); if(ISO.test(v)) return isoToSerial(v); const n = Number(v); if(isNaN(n)) throw new XErr(ERR.VAL); return n; };

  const bool = v => { if(typeof v === 'boolean') return v; if(typeof v === 'number') return v !== 0; if(v === '' || v == null) return false; const u = String(v).toUpperCase(); if(u === 'TRUE') return true; if(u === 'FALSE') return false; throw new XErr(ERR.VAL); };
  const flat = a => a.flat(Infinity);
  const isRange = v => Array.isArray(v);
  const nums = a => { const out = []; for(const x of a){ if(isRange(x)){ for(const v of flat(x)){ if(isErr(v)) throw new XErr(v); if(typeof v === 'number') out.push(v); } } else if(x !== undefined){ out.push(num(x)); } } return out; };
  function matchCrit(v, crit){
    let c = crit, op = '=';
    if(typeof c === 'string'){ const m = /^(<=|>=|<>|=|<|>)(.*)$/.exec(c); if(m){ op = m[1]; c = m[2]; } }
    const cn = Number(c), vn = typeof v === 'number' ? v : Number(v);
    const numeric = c !== '' && !isNaN(cn) && v !== '' && v !== null && !isNaN(vn);
    if(numeric){ return {'=':vn===cn,'<>':vn!==cn,'<':vn<cn,'>':vn>cn,'<=':vn<=cn,'>=':vn>=cn}[op]; }

    return {'<':a<b,'>':a>b,'<=':a<=b,'>=':a>=b}[op];
  }
  const ymd = v => { if(typeof v === 'number'){ const d = new Date(Date.UTC(1899,11,30) + v*864e5); return [d.getUTCFullYear(), d.getUTCMonth()+1, d.getUTCDate()]; } const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(str(v)); if(!m) throw new XErr(ERR.VAL); return [+m[1], +m[2], +m[3]]; };

  const MON = ['January','February','March','April','May','June','July','August','September','October','November','December'], DOW = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  function textFmt(v, f){
    const fl = f.toLowerCase();
    if(/[ymd]/.test(fl) && !/[#0]/.test(fl)){ const n = num(v), [y, m, d] = ymd(n), wd = new Date(Date.UTC(y, m-1, d)).getUTCDay();
      return f.replace(/yyyy|yy|mmmm|mmm|mm|m|dddd|ddd|dd|d/gi, t => { t = t.toLowerCase(); return {yyyy:String(y), yy:String(y).slice(2), mmmm:MON[m-1], mmm:MON[m-1].slice(0,3), mm:String(m).padStart(2,'0'), m:String(m), dddd:DOW[wd], ddd:DOW[wd].slice(0,3), dd:String(d).padStart(2,'0'), d:String(d)}[t]; }); }
    let n = num(v); const pct = f.includes('%'); if(pct) n *= 100;
    const dec = (/\.(0+)/.exec(f) || [,''])[1].length; const comma = f.includes(',');
    let out = Math.abs(n).toLocaleString('en-US', {minimumFractionDigits:dec, maximumFractionDigits:dec, useGrouping:comma});
    const pre = (/^[^#0]*/.exec(f) || [''])[0].replace(/"/g, ''), post = (/[^#0.,%]*$/.exec(f) || [''])[0].replace(/"/g, '');
    return (n < 0 ? '-' : '') + pre + out + (pct ? '%' : '') + post;
  }
  const workdays = (a, b) => { let c = 0; const s0 = Math.min(a, b), s1 = Math.max(a, b); for(let s = s0; s <= s1; s++){ const wd = (s + 6) % 7; if(wd !== 0 && wd !== 6) c++; } return a <= b ? c : -c; };
  const as2D = v => isRange(v) ? v : [[v]];
  const FN = {
    SUM: a => nums(a).reduce((s, v) => s + v, 0),
    AVERAGE: a => { const n = nums(a); if(!n.length) throw new XErr(ERR.DIV); return n.reduce((s,v)=>s+v,0)/n.length; },
    MIN: a => { const n = nums(a); return n.length ? Math.min(...n) : 0; },
    MAX: a => { const n = nums(a); return n.length ? Math.max(...n) : 0; },
    COUNT: a => flat(a).filter(v => typeof v === 'number').length,
    COUNTA: a => flat(a).filter(v => v !== '' && v !== null && v !== undefined).length,
    COUNTBLANK: a => flat(a).filter(v => v === '' || v === null || v === undefined).length,
    ROUND: a => { const f = Math.pow(10, num(a[1] ?? 0)); return Math.round(num(a[0]) * f + Math.sign(num(a[0]))*1e-9) / f; },
    ROUNDUP: a => { const f = Math.pow(10, num(a[1] ?? 0)); return Math.ceil(num(a[0]) * f - 1e-9) / f; },
    ROUNDDOWN: a => { const f = Math.pow(10, num(a[1] ?? 0)); return Math.floor(num(a[0]) * f + 1e-9) / f; },
    ABS: a => Math.abs(num(a[0])),
    IF: null, IFERROR: null, IFS: null, AND: null, OR: null, // lazy, handled in evaluator
    NOT: a => !bool(a[0]),
    SUMIF: a => { const r = flat(a[0]), s = a[2] !== undefined ? flat(a[2]) : r; return r.reduce((t, v, i) => t + (matchCrit(v, a[1]) && typeof s[i] === 'number' ? s[i] : 0), 0); },
    COUNTIF: a => flat(a[0]).filter(v => matchCrit(v, a[1])).length,
    AVERAGEIF: a => { const r = flat(a[0]), s = a[2] !== undefined ? flat(a[2]) : r; const n = r.map((v, i) => matchCrit(v, a[1]) && typeof s[i] === 'number' ? s[i] : null).filter(x => x !== null); if(!n.length) throw new XErr(ERR.DIV); return n.reduce((x,y)=>x+y,0)/n.length; },
    SUMIFS: a => { const s = flat(a[0]); return s.reduce((t, v, i) => { for(let k=1;k<a.length;k+=2){ if(!matchCrit(flat(a[k])[i], a[k+1])) return t; } return t + (typeof v === 'number' ? v : 0); }, 0); },
    COUNTIFS: a => { const n = flat(a[0]).length; let c = 0; for(let i=0;i<n;i++){ let ok = true; for(let k=0;k<a.length;k+=2) if(!matchCrit(flat(a[k])[i], a[k+1])) ok = false; if(ok) c++; } return c; },
    VLOOKUP: a => { const tbl = a[1], col = num(a[2]), approx = a[3] === undefined ? true : bool(a[3]); if(col < 1 || col > tbl[0].length) throw new XErr(ERR.REF);
      if(!approx){ const row = tbl.find(r => matchCrit(r[0], typeof a[0] === 'number' ? a[0] : '=' + str(a[0]))); if(!row) throw new XErr(ERR.NA); return row[col-1]; }
      let best = null; for(const r of tbl){ if(typeof r[0] === typeof a[0] && r[0] <= a[0]) best = r; } if(!best) throw new XErr(ERR.NA); return best[col-1]; },
    XLOOKUP: a => { const look = flat(a[1]), ret = a[2]; const i = look.findIndex(v => matchCrit(v, typeof a[0] === 'number' ? a[0] : '=' + str(a[0]))); if(i < 0){ if(a[3] !== undefined) return a[3]; throw new XErr(ERR.NA); } const r = flat(ret); return r[i]; },
    MATCH: a => { const look = flat(a[1]); const type = a[2] === undefined ? 1 : num(a[2]); if(type === 0){ const i = look.findIndex(v => matchCrit(v, typeof a[0] === 'number' ? a[0] : '=' + str(a[0]))); if(i < 0) throw new XErr(ERR.NA); return i+1; } let best = -1; look.forEach((v, i) => { if(v <= a[0]) best = i; }); if(best < 0) throw new XErr(ERR.NA); return best+1; },
    INDEX: a => { const t = a[0], r = num(a[1] ?? 1), c = num(a[2] ?? 1); const rows = t.length, cols = t[0].length; let rr = r, cc = c; if(rows === 1 && a[2] === undefined){ rr = 1; cc = r; } if(rr < 1 || rr > rows || cc < 1 || cc > cols) throw new XErr(ERR.REF); return t[rr-1][cc-1]; },
    LEFT: a => str(a[0]).slice(0, a[1] === undefined ? 1 : num(a[1])),

<script>// ===== Lumi's Data Lab: Excel + Power BI course content =====
// Steps are tiny on purpose: one idea or one action per screen.
const G = (rows, r0 = 1) => { const o = {}; rows.forEach((row, i) => row.forEach((v, j) => { if(v !== null && v !== undefined && v !== '') o[XL.numToCol(j+1) + (r0+i)] = v; })); return o; };
const V = (s, a) => s.value(a);
const F = (s, a) => (s.formulaOf(a) || '').toUpperCase();
const near = (a, b) => typeof a === 'number' && Math.abs(a - b) < 0.011;
function colCheck(s, col, from, to, expect, needFormula = true){
  for(let r = from; r <= to; r++){
    const a = col + r, v = V(s, a), e = expect(r);
    if(needFormula && !F(s, a)) return `${a} needs a formula (start with =), not a typed value.`;
    if(XL.isErr(v)) return `${a} shows ${v}. Check the formula in that cell.`;
    if(typeof e === 'number' ? !near(v, e) : String(v) !== String(e)) return `${a} shows ${XL.fmt(v)} but should be ${XL.fmt(e)}.`;
  }
  return true;
}

{ id:'x5', title:'Lookups: VLOOKUP & XLOOKUP', mins:9, why:'"Can you pull the price from the other sheet?" Lookups are the most-asked Excel interview skill.', steps:[
  { type:'learn', title:'Why look things up?', text:'You have a list of orders and a separate price list. A lookup <b>finds</b> each product in the price list and <b>brings back</b> its price, like a phone book.', visual:'lookup' },
  { type:'sheet', title:'VLOOKUP the price', task:'In <b>B2:B5</b>, look up each product\'s price from the table in <b>F1:G7</b>.<br><code>=VLOOKUP(A2,$F$2:$G$7,2,FALSE)</code>', cells:{...G([['Product','Price'],['Taro Milk Tea'],['Mochi Donut'],['Classic Milk Tea'],['Mango Fruit Tea']]), ...G(PRICE_TBL.map(r => [null,null,null,null,null,...r]))}, cols:7, rows:8, select:'B2',
    check:s => !/LOOKUP\(/.test(F(s,'B2')) ? 'Use VLOOKUP in B2.' : colCheck(s, 'B', 2, 5, r => [0,0,6,3.5,5.5,5.75][r]), solution:{B2:'=VLOOKUP(A2,$F$2:$G$7,2,FALSE)',B3:'=VLOOKUP(A3,$F$2:$G$7,2,FALSE)',B4:'=VLOOKUP(A4,$F$2:$G$7,2,FALSE)',B5:'=VLOOKUP(A5,$F$2:$G$7,2,FALSE)'}, hint:'Lock the table with $ so it doesn\'t move when you fill down.' },
  { type:'quiz', q:'Why put FALSE at the end of VLOOKUP?', opts:['It turns the formula off','It asks for an exact match','It sorts the table','It returns the first column'], a:1, why:'FALSE = exact match. Without it, VLOOKUP may return a close-but-wrong row.' },
  { type:'learn', title:'XLOOKUP: the modern way', text:'<code>=XLOOKUP(what, look_in, return_from)</code><br>Easier to read, exact match by default, and it can look <b>left</b>. Available in Excel 365 and 2021+.', tip:'Add a 4th argument for "not found": =XLOOKUP(A2,F:F,H:H,"Missing")' },
  { type:'sheet', title:'XLOOKUP the region', task:'In <b>B2:B5</b>, use <b>XLOOKUP</b> to find each store\'s <b>Region</b> from the table on the right.', cells:{...G([['Store','Region'],['Harbor'],['Sunset'],['Lakeside'],['Downtown']]), ...G([[null,null,null,null,'Store','City','Region'],[null,null,null,null,'Downtown','Seattle','West'],[null,null,null,null,'Lakeside','Chicago','Midwest'],[null,null,null,null,'Harbor','Boston','East'],[null,null,null,null,'Sunset','San Diego','West'],[null,null,null,null,'Uptown','New York','East']])}, cols:7, rows:7, select:'B2',
    check:s => !/XLOOKUP\(/.test(F(s,'B2')) ? 'Use XLOOKUP: =XLOOKUP(A2,$E$2:$E$6,$G$2:$G$6)' : colCheck(s, 'B', 2, 5, r => ['','','East','West','Midwest','West'][r]), solution:{B2:'=XLOOKUP(A2,$E$2:$E$6,$G$2:$G$6)',B3:'=XLOOKUP(A3,$E$2:$E$6,$G$2:$G$6)',B4:'=XLOOKUP(A4,$E$2:$E$6,$G$2:$G$6)',B5:'=XLOOKUP(A5,$E$2:$E$6,$G$2:$G$6)'}, hint:'Look in E (Store), return from G (Region).' },
  { type:'learn', title:'INDEX + MATCH', text:'Older but still loved in interviews. <code>MATCH</code> finds the <b>position</b>, and <code>INDEX</code> returns the value at that position: <code>=INDEX(G2:G7, MATCH(A2, F2:F7, 0))</code>.', tip:'The 0 in MATCH means exact match, like FALSE in VLOOKUP.' },
  { type:'sheet', title:'INDEX/MATCH the category', task:'In <b>B2:B4</b>, return each product\'s <b>Category</b> using INDEX and MATCH.', cells:{...G([['Product','Category'],['Mochi Donut'],['Mango Fruit Tea'],['Matcha Latte']]), ...G([[null,null,null,null,null,'Product','Category'],[null,null,null,null,null,'Classic Milk Tea','Milk Tea'],[null,null,null,null,null,'Mango Fruit Tea','Fruit Tea'],[null,null,null,null,null,'Matcha Latte','Milk Tea'],[null,null,null,null,null,'Mochi Donut','Snacks']])}, cols:7, rows:6, select:'B2',
    check:s => !(/INDEX\(/.test(F(s,'B2')) && /MATCH\(/.test(F(s,'B2'))) ? 'Use both INDEX and MATCH in B2.' : colCheck(s, 'B', 2, 4, r => ['','','Snacks','Fruit Tea','Milk Tea'][r]), solution:{B2:'=INDEX($G$2:$G$5,MATCH(A2,$F$2:$F$5,0))',B3:'=INDEX($G$2:$G$5,MATCH(A3,$F$2:$F$5,0))',B4:'=INDEX($G$2:$G$5,MATCH(A4,$F$2:$F$5,0))'}, hint:'=INDEX($G$2:$G$5,MATCH(A2,$F$2:$F$5,0))' },
  { type:'real', title:'Try it in real Excel', items:['Open sheet "5 Lookups"','Do the VLOOKUP, then redo it with XLOOKUP','Break one product name on purpose and see #N/A'], file:'excel' }
]},
// ------------------------------------------------------------------ EXCEL 6
{ id:'x6', title:'SUMIF, COUNTIF & Clean Text', mins:8, why:'"Total sales for the West region" and "clean up this messy export" are daily tasks.', steps:[
  { type:'learn', title:'Add only what matches', text:'<code>=SUMIF(range_to_check, "criteria", range_to_add)</code><br><code>=COUNTIF(range, "criteria")</code><br>Criteria can be text like <code>"West"</code> or a comparison like <code>">100"</code>.' },
  { type:'sheet', title:'SUMIF and COUNTIF', task:'<b>F1</b>: total revenue for <b>West</b> (SUMIF).<br><b>F2</b>: how many orders are <b>over 100</b> (COUNTIF).', cells:G([['Region','Category','Revenue','','West total'],['West','Milk Tea',120,'','Orders > 100'],['East','Snacks',45,'','West Milk Tea'],['West','Fruit Tea',88],['Midwest','Milk Tea',150],['West','Milk Tea',210],['East','Milk Tea',95],['South','Fruit Tea',60],['West','Snacks',32]]), cols:6, rows:10, select:'F1',
    check:s => !/SUMIF\(/.test(F(s,'F1')) ? 'F1 needs SUMIF.' : !/COUNTIF\(/.test(F(s,'F2')) ? 'F2 needs COUNTIF.' : V(s,'F1') !== 450 ? 'F1 should be 450 (all West revenue).' : V(s,'F2') !== 3 ? 'F2 should be 3. Criteria: ">100" in quotes.' : true,
    solution:{F1:'=SUMIF(A2:A9,"West",C2:C9)',F2:'=COUNTIF(C2:C9,">100")'}, hint:'=SUMIF(A2:A9,"West",C2:C9) and =COUNTIF(C2:C9,">100")' },
  { type:'sheet', title:'Two conditions: SUMIFS', task:'<b>F3</b>: revenue for <b>West</b> AND <b>Milk Tea</b>.<br>Note: in SUMIFS, the <b>sum range comes first</b>.', cells:G([['Region','Category','Revenue','','West total','=SUMIF(A2:A9,"West",C2:C9)'],['West','Milk Tea',120,'','Orders > 100','=COUNTIF(C2:C9,">100")'],['East','Snacks',45,'','West Milk Tea'],['West','Fruit Tea',88],['Midwest','Milk Tea',150],['West','Milk Tea',210],['East','Milk Tea',95],['South','Fruit Tea',60],['West','Snacks',32]]), cols:6, rows:10, select:'F3',
    check:s => !/SUMIFS\(/.test(F(s,'F3')) ? 'Use SUMIFS in F3.' : V(s,'F3') === 330 ? true : 'F3 should be 330 (120 + 210).', solution:{F3:'=SUMIFS(C2:C9,A2:A9,"West",B2:B9,"Milk Tea")'}, hint:'=SUMIFS(C2:C9,A2:A9,"West",B2:B9,"Milk Tea")' },
  { type:'learn', title:'Clean messy text', text:'Exports are messy. Fix them with:<br><code>TRIM</code> removes extra spaces · <code>PROPER</code> makes Title Case · <code>UPPER</code>/<code>LOWER</code> · <code>LEFT(text, n)</code> takes the first n characters · <code>&</code> joins text.', tip:'Functions can nest: =PROPER(TRIM(A2)) trims first, then fixes the case.' },
  { type:'sheet', title:'Fix customer names', task:'In <b>B2:B4</b>, clean the names: <code>=PROPER(TRIM(A2))</code>, then fill down.', cells:G([['Raw name','Clean name'],['  ana LOPEZ '],['BEN   carter'],['cy nguyen  ']]), cols:2, rows:5, select:'B2',
    check:s => colCheck(s, 'B', 2, 4, r => ['','','Ana Lopez','Ben Carter','Cy Nguyen'][r]), solution:{B2:'=PROPER(TRIM(A2))',B3:'=PROPER(TRIM(A3))',B4:'=PROPER(TRIM(A4))'}, hint:'=PROPER(TRIM(A2))' },
  { type:'sheet', title:'Make a store code', task:'In <b>B2:B4</b>, build a code like <b>DOW-WEST</b>: the first 3 letters of the store in capitals, a dash, then the region in capitals.', cells:G([['Store','Code','Region'],['Downtown','','West'],['Harbor','','East'],['Lakeside','','Midwest']]), cols:3, rows:5, select:'B2',
    check:s => colCheck(s, 'B', 2, 4, r => ['','','DOW-WEST','HAR-EAST','LAK-MIDWEST'][r]), solution:{B2:'=UPPER(LEFT(A2,3))&"-"&UPPER(C2)',B3:'=UPPER(LEFT(A3,3))&"-"&UPPER(C3)',B4:'=UPPER(LEFT(A4,3))&"-"&UPPER(C4)'}, hint:'=UPPER(LEFT(A2,3))&"-"&UPPER(C2)' },
  { type:'real', title:'Try it in real Excel', items:['Open sheet "6 IFs & Text"','Use SUMIFS for each region','Try Flash Fill: type one clean name, then press Ctrl+E'], file:'excel' }
]},
// ------------------------------------------------------------------ EXCEL 7
{ id:'x7', title:'Sort, Filter & Highlight', mins:6, why:'Finding the top items and the problems fast is what managers do every Monday morning.', steps:[
  { type:'learn', title:'Turn data into a Table', text:'In real Excel, click inside your data and press <b>Ctrl+T</b>. You get filter buttons, banded rows, and formulas that auto-fill new rows. Always do this first!', tip:'Tables also make PivotTables and charts update automatically.' },
  { type:'table', title:'Sort biggest first', task:'Sort the table by <b>Revenue</b>, <b>largest to smallest</b>. Click the ▾ on the Revenue header.', goal:'sort',
    check:st => st.sort && st.sort.col === 'Revenue' && st.sort.dir === 'desc' ? true : 'Open the Revenue ▾ menu and choose "Largest → Smallest".', solution:{sort:{col:'Revenue', dir:'desc'}} },
  { type:'table', title:'Filter one region', task:'Filter so only <b>West</b> orders show. Use the ▾ on the Region header.', goal:'filter',
    check:st => st.filter && st.filter.Region && st.filter.Region.length === 1 && st.filter.Region[0] === 'West' ? true : 'Open Region ▾ and keep only West ticked.', solution:{filter:{Region:['West']}} },
  { type:'learn', title:'Conditional formatting', text:'Colour cells automatically by rule, for example "highlight revenue over 500 in green." Your eye jumps to what matters. Find it at <b>Home → Conditional Formatting</b>.', visual:'cf' },
  { type:'table', title:'Highlight big orders', task:'Add a rule: highlight <b>Revenue greater than 500</b>.', goal:'cf',
    check:st => st.cf && st.cf.col === 'Revenue' && st.cf.op === '>' && +st.cf.val === 500 ? true : 'Click "Conditional formatting", then pick Revenue, "greater than", 500.', solution:{cf:{col:'Revenue', op:'>', val:500, color:'#bfeedd'}} },
  { type:'quiz', q:'Your data has 5,000 rows. What should you do first?', opts:['Sort it by hand','Format it as a Table (Ctrl+T)','Print it','Delete the headers'], a:1, why:'Tables give you filters, structure, and auto-expanding ranges for formulas, pivots and charts.' },
  { type:'real', title:'Try it in real Excel', items:['Open sheet "7 Orders"','Press Ctrl+T, then sort and filter','Add a green rule for Revenue > 500'], file:'excel' }
]},
// ------------------------------------------------------------------ EXCEL 8
{ id:'x8', title:'PivotTables & Charts', mins:9, why:'PivotTables turn thousands of rows into a summary in 10 seconds. This is the #1 Excel skill hiring managers test.', steps:[
  { type:'learn', title:'PivotTables in one picture', text:'Pick fields into four boxes:<br><b>Rows</b> = what to group by · <b>Columns</b> = split across the top · <b>Values</b> = what to add up · <b>Filters</b> = narrow it down.<br>In Excel: <b>Insert → PivotTable</b>.', visual:'pivot' },
  { type:'pivot', title:'Revenue by region', task:'Build a pivot: <b>Region</b> in Rows, <b>Sum of Revenue</b> in Values.',
    check:c => c.rows[0] === 'Region' && c.rows.length === 1 && !c.cols.length && c.val === 'Revenue' && c.agg === 'Sum' ? true : 'Rows: Region only. Values: Revenue with Sum.', solution:{rows:['Region'], cols:[], val:'Revenue', agg:'Sum'} },
  { type:'pivot', title:'Add columns', task:'Now: <b>Category</b> in Rows, <b>Quarter</b> in Columns, <b>Sum of Revenue</b> in Values.',
    check:c => c.rows.join() === 'Category' && c.cols.join() === 'Quarter' && c.val === 'Revenue' && c.agg === 'Sum' ? true : 'Rows: Category, Columns: Quarter, Values: Sum of Revenue.', solution:{rows:['Category'], cols:['Quarter'], val:'Revenue', agg:'Sum'} },
  { type:'learn', title:'Pick the right chart', text:'<b>Line</b> = trend over time · <b>Column</b> = compare a few things · <b>Bar</b> = compare many things or long names · <b>Pie</b> = parts of a whole, but only 2 to 5 slices.', visual:'charts', tip:'If you\'re unsure, a column chart is almost never wrong.' },
  { type:'chart', title:'Show the trend', task:'Make a chart of <b>revenue by Month</b> that shows the <b>trend</b> through the year.',
    check:c => c.type === 'line' && c.axis === 'Month' ? true : c.axis !== 'Month' ? 'Put Month on the axis.' : 'For a trend over time, use a line chart.', solution:{type:'line', axis:'Month'} },
  { type:'quiz', q:'Compare revenue across 6 stores. Best chart?', opts:['Pie','Line','Column','Scatter'], a:2, why:'Column charts compare categories side by side. A line implies time, and a pie with 6 slices is hard to read.' },
  { type:'real', title:'Mini project in real Excel', items:['Open sheet "8 Data" (840 real-ish orders)','Insert → PivotTable: Revenue by Region and Month','Insert → PivotChart (line), then add a Slicer for Category','You just built a dashboard! 🎉'], file:'excel' }
]}
]},

{ id:'pbi', name:'Power BI', color:'#fff1b8', accent:'#c99a06', icon:'chart',
  blurb:'Clean data, model it, write DAX, and build interactive dashboards like a BI analyst.',
  lessons:[
// ------------------------------------------------------------------ PBI 1
{ id:'p1', title:'What is Power BI?', mins:5, why:'Knowing the workflow lets you talk about Power BI confidently in interviews, even before you\'re an expert.', steps:[
  { type:'learn', title:'Excel\'s big sibling', text:'<b>Power BI</b> turns raw data into interactive dashboards. <b>Power BI Desktop</b> (free, Windows) is where you build. The <b>Power BI Service</b> (online) is where you share. It handles millions of rows that would make Excel cry.', visual:'pbilogo' },
  { type:'order', title:'The Power BI workflow', task:'Tap the steps in the order you\'d do them.', items:['Get data','Clean it in Power Query','Model the relationships','Write DAX measures','Build visuals','Publish & share'] },
  { type:'learn', title:'The three views', text:'Icons on the left of Power BI Desktop:<br>📊 <b>Report</b>: build visuals · 🗂️ <b>Table</b>: see your data · 🔗 <b>Model</b>: connect tables.<br>On the right are the panes: <b>Visualizations</b>, <b>Data</b> (fields) and <b>Filters</b>.', visual:'pbiui' },
  { type:'quiz', q:'Which tool would you pick for a live dashboard that 50 managers filter themselves?', opts:['A printed Excel sheet','Power BI','Notepad','A PDF'], a:1, why:'Power BI dashboards are interactive, refresh automatically and can be shared securely.' },
  { type:'real', title:'Set up Power BI Desktop', items:['Install "Power BI Desktop" free from the Microsoft Store (Windows)','Download the Lumi Boba dataset (button below)','Home → Get data → Excel workbook → tick all 4 tables → Load','Explore the Table view 👀'], file:'pbi' }
]},
// ------------------------------------------------------------------ PBI 2
{ id:'p2', title:'Power Query: Clean the Mess', mins:8, why:'Analysts spend most of their time cleaning data. Power Query makes cleaning repeatable.', steps:[
  { type:'learn', title:'A robot that remembers', text:'Power Query records every cleaning click as an <b>Applied Step</b>. Next month, new data arrives and you hit <b>Refresh</b>: every step re-runs automatically. No redoing work!', visual:'steps' },
  { type:'pq', title:'Remove junk rows', task:'This export has <b>blank rows</b> and a <b>duplicate</b>. Remove both using the table buttons.', goals:['blank','dup'], solution:[{op:'removeBlank'},{op:'removeDup'}] },
  { type:'pq', title:'Full clean-up', task:'Make this table analysis-ready. Tick every goal on the list.', goals:['blank','dup','trim','proper','number','split'], solution:[{op:'removeBlank'},{op:'trim',col:'Customer'},{op:'proper',col:'Customer'},{op:'removeDup'},{op:'type',col:'Amount',to:'number'},{op:'split',col:'Location',delim:','}] },
  { type:'quiz', q:'Next month\'s file arrives with 500 new messy rows. What do you do?', opts:['Clean it all again by hand','Click Refresh: the Applied Steps re-run','Delete the report','Email IT'], a:1, why:'That\'s the superpower: steps are saved and replayed on refresh.' },
  { type:'real', title:'Try it in Power BI Desktop', items:['Home → Transform data (opens Power Query)','Get data → Text/CSV → Messy_Customers.csv','Remove blank rows, Trim, Capitalize Each Word, Remove duplicates','Change Amount to Decimal Number, Split Location by comma','Close & Apply'], file:'pbi' }
]},
// ------------------------------------------------------------------ PBI 3
{ id:'p3', title:'Data Modeling: Star Schema', mins:7, why:'A good model makes every visual and DAX formula easy. A bad model makes everything wrong.', steps:[
  { type:'learn', title:'Facts and dimensions', text:'<b>Fact</b> table = events with numbers (each sale). <b>Dimension</b> tables = descriptions (product, store, date). Put the fact in the middle and the dimensions around it, and you get a <b>star schema</b> ⭐.', visual:'star' },
  { type:'quiz', q:'Which is the FACT table?', opts:['Products (name, category, price)','Stores (name, city, region)','Sales (date, store, product, qty, revenue)','Calendar (date, month, year)'], a:2, why:'Sales records events with numbers to add up. The others describe those events.' },
  { type:'model', title:'Connect the tables', task:'Create the 3 relationships. Click a key column in <b>Sales</b>, then the matching column in the other table.' },
  { type:'learn', title:'One-to-many (1:*)', text:'One product appears in <b>many</b> sales. Filters flow from the "one" side (Products) <b>to</b> the "many" side (Sales). Click "Milk Tea" in a slicer, and Sales shows only Milk Tea rows.', visual:'flow' },
  { type:'quiz', q:'Products → Sales is one-to-many. A slicer on Products[Category] filters…', opts:['Nothing','Sales rows for that category','Only the Products table','The Calendar'], a:1, why:'Filters flow down the relationship from the one side to the many side.' },
  { type:'real', title:'Try it in Power BI Desktop', items:['Open Model view (left icon 🔗)','Drag Sales[ProductID] onto Products[ProductID]','Do the same for StoreID and Date','Check each line shows 1 and *'], file:'pbi' }
]},
// ------------------------------------------------------------------ PBI 4
{ id:'p4', title:'DAX Basics: Measures', mins:9, why:'DAX measures are the numbers on every dashboard. Writing them is the core Power BI job skill.', steps:[
  { type:'learn', title:'What is a measure?', text:'A <b>measure</b> is a reusable calculation that recalculates for whatever is filtered or selected. You write it once: <code>Total Revenue = SUM(Sales[Revenue])</code>, then use it in any visual.', tip:'Columns are written Table[Column]. Measures are written [Measure Name].' },
  { type:'dax', title:'Your first measure', task:'Create <code>Total Revenue = SUM(Sales[Revenue])</code>', target:'Total Revenue', matrix:['Stores','Region'],
    check:(v, m) => /SUM\s*\(\s*Sales\[Revenue\]/i.test(m.text) && near(v, TOTALS.revenue) ? true : 'Use SUM on the Sales[Revenue] column.', solution:'Total Revenue = SUM(Sales[Revenue])' },
  { type:'dax', title:'Count the orders', task:'Create <code>Total Orders</code>: count the rows of the Sales table with <b>COUNTROWS</b>.', target:'Total Orders', matrix:['Stores','Region'],
    check:(v, m) => /COUNTROWS/i.test(m.text) && v === TOTALS.orders ? true : 'Try: Total Orders = COUNTROWS(Sales)', solution:'Total Orders = COUNTROWS(Sales)' },
  { type:'dax', title:'Average order value', task:'Create <code>Avg Order Value</code> = <b>[Total Revenue] ÷ [Total Orders]</b> using <b>DIVIDE</b>.', target:'Avg Order Value', matrix:['Products','Category'], pre:['Total Revenue = SUM(Sales[Revenue])','Total Orders = COUNTROWS(Sales)'],
    check:(v, m) => /DIVIDE/i.test(m.text) && near(v, TOTALS.revenue / TOTALS.orders) ? true : 'Try: Avg Order Value = DIVIDE([Total Revenue], [Total Orders])', solution:'Avg Order Value = DIVIDE([Total Revenue], [Total Orders])' },
  { type:'quiz', q:'Why use DIVIDE(a, b) instead of a / b?', opts:['It\'s faster to type','It safely returns blank instead of an error when b is 0','It rounds the answer','It only works on text'], a:1, why:'DIVIDE handles divide-by-zero gracefully: no ugly errors on your dashboard.' },
  { type:'dax', title:'Units sold', task:'Create <code>Units Sold</code>: the sum of the <b>Qty</b> column.', target:'Units Sold', matrix:['Products','Category'],
    check:(v, m) => near(v, TOTALS.qty) ? true : 'Sum the Sales[Qty] column.', solution:'Units Sold = SUM(Sales[Qty])' },
  { type:'real', title:'Try it in Power BI Desktop', items:['Table view → Sales table → New measure','Type each measure from this lesson','Drag Total Revenue onto the canvas as a Card visual'], file:'pbi' }
]},
// ------------------------------------------------------------------ PBI 5
{ id:'p5', title:'CALCULATE & Filter Context', mins:9, why:'CALCULATE is the most important DAX function. Understanding filter context is what interviewers probe.', steps:[
  { type:'learn', title:'Filter context', text:'Put <b>[Total Revenue]</b> in a table by Region and each row shows a different number. It\'s the same measure, but each row has a different <b>filter</b> on it. That\'s <b>filter context</b>.', visual:'context' },
  { type:'dax', title:'CALCULATE with a filter', task:'Create <code>West Revenue</code> = Total Revenue, but only for <b>Region = "West"</b>.', target:'West Revenue', matrix:['Products','Category'], pre:['Total Revenue = SUM(Sales[Revenue])'],
    check:(v, m) => /CALCULATE/i.test(m.text) && near(v, TOTALS.west) ? true : 'Try: West Revenue = CALCULATE([Total Revenue], Stores[Region] = "West")', solution:'West Revenue = CALCULATE([Total Revenue], Stores[Region] = "West")' },
  { type:'quiz', q:'CALCULATE([Total Revenue], Stores[Region] = "West") inside a row for Region = East returns…', opts:['East revenue','West revenue: CALCULATE replaces the Region filter','Blank','Total of all regions'], a:1, why:'A filter in CALCULATE on the same column overrides the existing filter.' },
  { type:'dax', title:'% of total with ALL', task:'Create <code>Revenue %</code> = Total Revenue ÷ revenue for <b>ALL</b> stores. Watch the matrix: the regions add up to 100%.', target:'Revenue %', matrix:['Stores','Region'], pct:true, pre:['Total Revenue = SUM(Sales[Revenue])'],
    check:(v, m, M) => /ALL\s*\(/i.test(m.text) && near(v, 1) && near(PBI.evalMeasure(M, m.ast, [{table:'Stores', col:'Region', pred:x => x === 'West'}]), TOTALS.west / TOTALS.revenue) ? true : 'Try: Revenue % = DIVIDE([Total Revenue], CALCULATE([Total Revenue], ALL(Stores)))', solution:'Revenue % = DIVIDE([Total Revenue], CALCULATE([Total Revenue], ALL(Stores)))' },
  { type:'dax', title:'Row-by-row with SUMX', task:'Create <code>Revenue Check</code> = SUMX over Sales of <b>Qty × the product\'s Price</b> (use RELATED).', target:'Revenue Check', matrix:['Products','Category'],
    check:(v, m) => /SUMX/i.test(m.text) && /RELATED/i.test(m.text) && near(v, TOTALS.revenue) ? true : 'Try: Revenue Check = SUMX(Sales, Sales[Qty] * RELATED(Products[Price]))', solution:'Revenue Check = SUMX(Sales, Sales[Qty] * RELATED(Products[Price]))' },
  { type:'real', title:'Try it in Power BI Desktop', items:['Create West Revenue and Revenue % as measures','Make a Matrix visual: Region in Rows, both measures in Values','Format Revenue % as a percentage (Measure tools → %)'], file:'pbi' }
]},
// ------------------------------------------------------------------ PBI 6
{ id:'p6', title:'Visuals & Slicers', mins:8, why:'A clear visual gets your analysis noticed and acted on.', steps:[
  { type:'learn', title:'Build a visual in 3 clicks', text:'1) Pick a visual type. 2) Click a <b>category</b> field (for the axis). 3) Click a <b>measure</b> (for the values). Power BI does the rest.', tip:'Cards for single KPIs, column or bar for comparisons, line for time.' },
  { type:'report', title:'Compare regions', task:'Make a <b>column chart</b> of <b>Total Revenue by Region</b>.', tiles:1,
    check:c => c.tiles.some(t => t.type === 'column' && t.axis === 'Stores.Region' && t.measure === 'Total Revenue') ? true : 'Column chart, axis Region, value Total Revenue.', solution:{tiles:[{type:'column', axis:'Stores.Region', measure:'Total Revenue'}], slicer:'All'} },
  { type:'report', title:'Show the trend', task:'Make a <b>line chart</b> of <b>Total Revenue by Month</b>.', tiles:1,
    check:c => c.tiles.some(t => t.type === 'line' && t.axis === 'Calendar.Month' && t.measure === 'Total Revenue') ? true : 'Line chart, axis Month (Calendar), value Total Revenue.', solution:{tiles:[{type:'line', axis:'Calendar.Month', measure:'Total Revenue'}], slicer:'All'} },
  { type:'learn', title:'Slicers = filters people can click', text:'A <b>slicer</b> is an on-canvas filter. Pick "East" and <b>every</b> visual on the page updates. That\'s what makes Power BI interactive.' },

{ id:'x9', title:'Dates & Number Formats', mins:9, why:'Due dates, tenure, "last month" and tidy labels show up in every business report.', steps:[
  { type:'learn', title:'Dates are secretly numbers', text:'Excel stores each date as a <b>number of days since 1900</b>. 1 Jan 2025 is really 45658. That\'s why you can subtract dates to get days, and why formatting only changes how a date <i>looks</i>, never its value.', tip:'If a date shows as 45658, just change the cell format to Date.' },
  { type:'sheet', title:'Days to ship', task:'In <b>C2:C5</b>, calculate how many days each order took to ship: <b>Ship date − Order date</b>.', cells:G([['Order date','Ship date','Days'],['2025-03-03','2025-03-07'],['2025-03-10','2025-03-18'],['2025-03-14','2025-03-17'],['2025-03-20','2025-04-01']]), cols:3, rows:6, select:'C2',
    check:s => colCheck(s, 'C', 2, 5, r => [0,0,4,8,3,12][r]), solution:{C2:'=B2-A2',C3:'=B3-A3',C4:'=B4-A4',C5:'=B5-A5'}, hint:'=B2-A2, then fill down.' },
  { type:'sheet', title:'Month-end due dates', task:'Invoices are due on the <b>last day of the month</b>. In <b>B2:B4</b> use <code>=EOMONTH(A2,0)</code>.', cells:G([['Invoice date','Due date'],['2025-01-15'],['2025-02-03'],['2024-02-10']]), cols:2, rows:5, select:'B2',

  { type:'learn', title:'Handy date functions', text:'<code>DATEDIF(start, end, "y")</code> gives whole years between two dates (also "m" and "d") · <code>NETWORKDAYS(start, end)</code> counts working days · <code>EDATE(date, 3)</code> is 3 months later · <code>DATE(2025,12,31)</code> builds a date · <code>TODAY()</code> is today.', tip:'DATEDIF is hidden: it won\'t show up in autocomplete, but it works!' },
  { type:'sheet', title:'Years of service', task:'In <b>C2:C4</b>, calculate full <b>years of service</b> at 31 Dec 2025: <code>=DATEDIF(B2, DATE(2025,12,31), "y")</code>.', cells:G([['Name','Hire date','Years'],['Maya','2016-03-01'],['Aisha','2020-01-10'],['Grace','2023-02-14']]), cols:3, rows:5, select:'C2',

  { type:'sheet', title:'Array math: SUMPRODUCT', task:'In <b>F1</b>, get total revenue (Cups × Price, summed) in <b>one formula</b>: <code>=SUMPRODUCT(B2:B6,C2:C6)</code>.', cells:{...G(BOBA.map(r => r.slice(0,3))), E1:'Total revenue'}, cols:6, rows:7, select:'F1',

{ id:'p8', title:'Power Query Pro: Shape Data', mins:9, why:'Real data comes wide, split across files, or missing lookups. Reshaping it is a daily BI task.', steps:[
  { type:'learn', title:'Four power moves', text:'<b>Unpivot</b>: wide → long (month columns become rows) · <b>Append</b>: stack tables with the same columns (Q1 + Q2) · <b>Merge</b>: bring in columns from another table, like a lookup or join · <b>Group By</b>: summarize rows.', tip:'Power BI loves long, narrow tables: one row per fact.' },
  { type:'pq', title:'Unpivot the budget', task:'This budget has one column per month. Select <b>Store</b>, click <b>Unpivot other columns</b>, then rename Attribute → <b>Month</b> and Value → <b>Budget</b>.', data:'wide', ops:['unpivot','rename'],
    goalFns:[['One row per store per month (12 rows)', s => s.rows.length === 12], ['Columns: Store, Month, Budget', s => s.cols.map(c => c.name).join() === 'Store,Month,Budget']],
    solution:[{op:'unpivot', keep:['Store']},{op:'rename', col:'Attribute', to:'Month'},{op:'rename', col:'Value', to:'Budget'}] },
  { type:'pq', title:'Append Q1 + Q2', task:'Stack the Q2 orders under Q1 with <b>Append Q2</b>.', data:'q1', ops:['append'], extra:'q2',
    goalFns:[['All 9 orders in one table', s => s.rows.length === 9], ['No duplicates', s => new Set(s.rows.map(r => r.OrderID)).size === s.rows.length]],
    solution:[{op:'append'}] },
  { type:'pq', title:'Merge in the Region', task:'Orders only have StoreID. Use <b>Merge with Stores</b> to bring in each order\'s <b>Region</b>.', data:'orders', ops:['merge'],
    goalFns:[['Region column added', s => s.cols.some(c => c.name === 'Region')], ['Every order has a region', s => s.rows.every(r => r.Region)]],

{ id:'p9', title:'Time Intelligence', mins:10, why:'"YTD", "vs last year" and "month over month" are on almost every executive dashboard.', steps:[
  { type:'learn', title:'You need a date table', text:'Time intelligence functions need a <b>Calendar</b> table with one row per day, no gaps, connected to your facts. In Power BI: select it → <b>Mark as date table</b>. Ours has every day of 2024 and 2025.', tip:'Create one with DAX: Calendar = CALENDARAUTO(), or build it in Power Query.' },
  { type:'dax', title:'Year-to-date', task:'Create <code>Revenue YTD = TOTALYTD([Total Revenue], Calendar[Date])</code>. The matrix shows 2025 by month: watch it build up.', target:'Revenue YTD', matrix:['Calendar','Month'], year:2025, pre:['Total Revenue = SUM(Sales[Revenue])'], auto:true, need:/TOTALYTD|DATESYTD/i,
    solution:'Revenue YTD = TOTALYTD([Total Revenue], Calendar[Date])' },
  { type:'dax', title:'Same period last year', task:'Create <code>Revenue LY</code> = Total Revenue, shifted back one year with <b>SAMEPERIODLASTYEAR</b>.', target:'Revenue LY', matrix:['Calendar','Month'], year:2025, pre:['Total Revenue = SUM(Sales[Revenue])'], auto:true, need:/SAMEPERIODLASTYEAR|DATEADD/i,
    solution:'Revenue LY = CALCULATE([Total Revenue], SAMEPERIODLASTYEAR(Calendar[Date]))' },
  { type:'dax', title:'YoY growth %', task:'Create <code>YoY %</code> = (Total Revenue − Revenue LY) ÷ Revenue LY. Use <b>DIVIDE</b>.', target:'YoY %', matrix:['Calendar','Month'], year:2025, pct:true, pre:['Total Revenue = SUM(Sales[Revenue])','Revenue LY = CALCULATE([Total Revenue], SAMEPERIODLASTYEAR(Calendar[Date]))'], auto:true, need:/DIVIDE/i,
    solution:'YoY % = DIVIDE([Total Revenue] - [Revenue LY], [Revenue LY])' },
  { type:'dax', title:'Previous month', task:'Create <code>Revenue PM</code> with <code>DATEADD(Calendar[Date], -1, MONTH)</code> inside CALCULATE.', target:'Revenue PM', matrix:['Calendar','Month'], year:2025, pre:['Total Revenue = SUM(Sales[Revenue])'], auto:true, need:/DATEADD|PREVIOUSMONTH/i,
    solution:'Revenue PM = CALCULATE([Total Revenue], DATEADD(Calendar[Date], -1, MONTH))' },
  { type:'quiz', q:'TOTALYTD returns blanks or nonsense. The most common cause?', opts:['Too many visuals','No proper date table (gaps, or not marked as date table)','Wrong colours','The measure name has spaces'], a:1, why:'Time intelligence needs a continuous Calendar table related to your facts and marked as a date table.' },
  { type:'real', title:'Try it in Power BI Desktop', items:['Table view → Calendar → Mark as date table','Create Revenue YTD, Revenue LY, YoY % and Revenue PM','Matrix: Year and Month in Rows, the four measures in Values','Format YoY % as a percentage with 1 decimal'], file:'pbi' }
]},

{ id:'p10', title:'Advanced DAX: Context, VAR & FILTER', mins:10, why:'Row vs filter context, variables and FILTER separate beginners from strong BI candidates.', steps:[
  { type:'learn', title:'Row context vs filter context', text:'<b>Calculated column</b>: computed once per row when data loads, using <b>row context</b> ("this row\'s Revenue"). <b>Measure</b>: computed on the fly for whatever is filtered (<b>filter context</b>). Use columns to slice or filter by; use measures for numbers.' },
  { type:'calccol', title:'A calculated column', task:'In the <b>Sales</b> table, create <code>Size = IF(Sales[Revenue] >= 50, "Large", "Small")</code>.', table:'Sales',
    check:(c, M) => c.vals.filter(v => v === 'Large').length === M.T.Sales.rows.filter(r => r.Revenue >= 50).length && c.vals.every(v => v === 'Large' || v === 'Small') ? true : 'Each row should be "Large" when Revenue ≥ 50, else "Small".', solution:'Size = IF(Sales[Revenue] >= 50, "Large", "Small")' },
  { type:'dax', title:'Variables make DAX readable', task:'Rewrite average order value with variables:<br><code>AOV = VAR rev = [Total Revenue] VAR ord = [Total Orders] RETURN DIVIDE(rev, ord)</code>', target:'AOV', matrix:['Products','Category'], pre:['Total Revenue = SUM(Sales[Revenue])','Total Orders = COUNTROWS(Sales)'], auto:true, need:/\bVAR\b[\s\S]*\bRETURN\b/i,
    solution:'AOV = VAR rev = [Total Revenue] VAR ord = [Total Orders] RETURN DIVIDE(rev, ord)' },
  { type:'dax', title:'Count with FILTER', task:'Create <code>Big Orders</code>: count Sales rows with Revenue ≥ 50, using <code>COUNTROWS(FILTER(...))</code>.', target:'Big Orders', matrix:['Stores','Region'], auto:true, need:/FILTER\s*\(/i,
    solution:'Big Orders = COUNTROWS(FILTER(Sales, Sales[Revenue] >= 50))' },
  { type:'dax', title:'CALCULATE + FILTER(ALL())', task:'Create <code>Premium Revenue</code>: Total Revenue for products priced over 6:<br><code>CALCULATE([Total Revenue], FILTER(ALL(Products), Products[Price] > 6))</code>', target:'Premium Revenue', matrix:['Products','Category'], pre:['Total Revenue = SUM(Sales[Revenue])'], auto:true, need:/FILTER\s*\(/i,
    solution:'Premium Revenue = CALCULATE([Total Revenue], FILTER(ALL(Products), Products[Price] > 6))' },
  { type:'quiz', q:'You want a slicer of "Large / Small" orders. Calculated column or measure?', opts:['Measure','Calculated column','Either','Neither'], a:1, why:'Slicers and axes need columns. Measures can\'t be used to slice.' },
  { type:'real', title:'Try it in Power BI Desktop', items:['Sales table → New column → Size','Add a slicer on Sales[Size]','Create AOV with VAR and check it matches your earlier measure','Use DAX query view to EVALUATE FILTER(Sales, Sales[Revenue] >= 50)'], file:'pbi' }
]},

<script>// ===== Lumi's Data Lab app =====
(function(){
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const h = (tag, attrs = {}, html = '') => { const e = document.createElement(tag); for(const k in attrs){ if(k === 'class') e.className = attrs[k]; else if(k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]); else e.setAttribute(k, attrs[k]); } if(html) e.innerHTML = html; return e; };
const KEY = 'lumi-datalab-v1';
const today = () => new Date().toISOString().slice(0, 10);
const PASTEL = ['#9ad9c1','#f7b6cc','#a9cdf5','#f8d77a','#c7b5f5','#f6b99a','#8fd3d3','#e8a5d8'];
const fmtNum = (v, money) => v === null || v === undefined || (typeof v === 'number' && isNaN(v)) ? '(blank)' : typeof v === 'number' ? (money ? '$' : '') + v.toLocaleString('en-US', {maximumFractionDigits: 2}) : String(v);

// ---------- state ----------
const DEF = { name:'', xp:0, done:{}, pos:{}, passed:{}, games:{}, streak:{last:'', count:0}, day:{date:'', steps:0}, goal:8, set:{calm:false, big:false, mins:15, speak:false}, parking:[], checks:{} };
let S = JSON.parse(JSON.stringify(DEF));

// ---------- charts ----------
function chartSVG(type, data, opts = {}){
  const W = opts.compact ? 380 : 520, H = opts.compact ? 230 : 260, pad = {l:50, r:12, t:14, b:40}; const money = opts.money !== false; const pct = opts.pct;
  const val = v => v == null || isNaN(v) ? 0 : v; const lab = v => pct ? (v*100).toFixed(1) + '%' : (money ? '$' : '') + (Math.abs(v) >= 10000 ? (v/1000).toFixed(0) + 'k' : Math.abs(v) >= 1000 ? (v/1000).toFixed(1) + 'k' : Math.round(v).toLocaleString());
  if(!data.length) return '<div class="empty">No data for this filter.</div>';
  if(type === 'pie'){ const tot = data.reduce((s, d) => s + val(d.value), 0) || 1; let a0 = -Math.PI/2; const cx = 130, cy = 130, R = 105, r = 58;
    const arcs = data.map((d, i) => { const a1 = a0 + val(d.value)/tot * Math.PI*2; const big = a1 - a0 > Math.PI ? 1 : 0; const p = (a, rr) => `${cx + rr*Math.cos(a)} ${cy + rr*Math.sin(a)}`;
      const path = `M${p(a0,R)} A${R} ${R} 0 ${big} 1 ${p(a1,R)} L${p(a1,r)} A${r} ${r} 0 ${big} 0 ${p(a0,r)} Z`; a0 = a1; return `<path d="${path}" fill="${PASTEL[i % PASTEL.length]}" stroke="#fff" stroke-width="2"><title>${esc(d.key)}: ${lab(val(d.value))}</title></path>`; }).join('');
    return `<svg viewBox="0 0 ${W} ${H}" class="chart">${arcs}${data.map((d, i) => `<rect x="280" y="${20 + i*22}" width="14" height="14" rx="4" fill="${PASTEL[i % PASTEL.length]}"/><text x="300" y="${32 + i*22}" class="tl">${esc(d.key)} · ${(val(d.value)/tot*100).toFixed(0)}%</text>`).join('')}</svg>`; }
  if(type === 'table') return `<table class="vt"><tr><th>${esc(opts.axisName || '')}</th><th>${esc(opts.valName || 'Value')}</th></tr>${data.map(d => `<tr><td>${esc(d.key)}</td><td>${lab(val(d.value))}</td></tr>`).join('')}</table>`;
  const max = Math.max(...data.map(d => val(d.value)), 0) * 1.1 || 1; const iw = W - pad.l - pad.r, ih = H - pad.t - pad.b;
  const ticks = [0, .25, .5, .75, 1].map(f => f * max);
  let g = ticks.map(t => { const y = pad.t + ih - t/max*ih; return `<line x1="${pad.l}" x2="${W-pad.r}" y1="${y}" y2="${y}" class="gl"/><text x="${pad.l-6}" y="${y+4}" text-anchor="end" class="tl">${lab(t)}</text>`; }).join('');
  if(type === 'bar'){ const bh = ih / data.length; const maxb = max; g = '';
    data.forEach((d, i) => { const w = val(d.value)/maxb * (iw - 60); g += `<text x="${pad.l + 70}" y="${pad.t + i*bh + bh/2 + 4}" text-anchor="end" class="tl">${esc(String(d.key).slice(0, 12))}</text><rect x="${pad.l + 76}" y="${pad.t + i*bh + bh*0.15}" width="${Math.max(w - 76, 1)}" height="${bh*0.7}" rx="5" fill="${PASTEL[0]}"><title>${esc(d.key)}: ${lab(val(d.value))}</title></rect><text x="${pad.l + 80 + Math.max(w - 76, 1)}" y="${pad.t + i*bh + bh/2 + 4}" class="tl">${lab(val(d.value))}</text>`; });
    return `<svg viewBox="0 0 ${W} ${H}" class="chart">${g}</svg>`; }
  const step = iw / data.length; const x = i => pad.l + step*i + step/2, y = v => pad.t + ih - val(v)/max*ih;
  const labels = data.map((d, i) => `<text x="${x(i)}" y="${H-pad.b+18}" text-anchor="middle" class="tl">${esc(String(d.key).slice(0, 10))}</text>`).join('');
  if(type === 'line'){ const pts = data.map((d, i) => `${x(i)},${y(d.value)}`).join(' ');
    return `<svg viewBox="0 0 ${W} ${H}" class="chart">${g}<polyline points="${pts}" fill="none" stroke="#7d6bd8" stroke-width="3" stroke-linejoin="round" class="draw"/>${data.map((d, i) => `<circle cx="${x(i)}" cy="${y(d.value)}" r="4.5" fill="#fff" stroke="#7d6bd8" stroke-width="2.5"><title>${esc(d.key)}: ${lab(val(d.value))}</title></circle>`).join('')}${labels}</svg>`; }
  return `<svg viewBox="0 0 ${W} ${H}" class="chart">${g}${data.map((d, i) => `<rect class="grow" x="${x(i) - step*0.32}" y="${y(d.value)}" width="${step*0.64}" height="${pad.t + ih - y(d.value)}" rx="6" fill="${PASTEL[i % PASTEL.length]}"><title>${esc(d.key)}: ${lab(val(d.value))}</title></rect>`).join('')}${labels}</svg>`;
}

R.sheet = (st, body, api) => {
  const sheet = new XL.Sheet(st.cells, {cols:st.cols, rows:st.rows, names:st.names || {}}); const undo = [];
  let sel = {a: st.select || 'A1', b: st.select || 'A1'}; let editing = false;
  body.innerHTML = `<h2>${esc(st.title)}</h2><p class="lead task">${st.task}</p>
   <div class="xl"><div class="xl-bar"><span class="namebox"></span><span class="fx">fx</span><input class="fxin" spellcheck="false" autocomplete="off" aria-label="Formula bar"></div>
   <div class="xl-tools"><button class="tb" data-a="fill" title="Fill down (Ctrl+D)">Fill ⬇</button><button class="tb" data-a="undo" title="Undo (Ctrl+Z)">↶ Undo</button><button class="tb" data-a="reset">↺ Reset</button>${st.goalseek ? '<button class="tb gs" data-a="goal">🎯 Goal Seek</button>' : ''}${st.names ? `<span class="pill small">Names: ${Object.entries(st.names).map(([k, v]) => k + ' = ' + v).join(', ')}</span>` : ''}<span class="small muted">Click a cell · type · Enter. Double-click to edit. Shift+click selects a range.</span></div>
   ${st.goalseek ? `<div class="gspanel" hidden><b>Goal Seek</b> Set cell <input id="gsSet" class="smallin" value="B5"> To value <input id="gsTo" class="smallin" placeholder="1500"> By changing cell <input id="gsBy" class="smallin" value="B1"> <button class="btn small" id="gsGo">OK</button></div>` : ''}<div class="xl-wrap" tabindex="0"><table class="xl-grid"></table></div></div>`;
  const grid = $('.xl-grid', body), wrap = $('.xl-wrap', body), fx = $('.fxin', body), nb = $('.namebox', body);
  const rc = a => XL.parseRef(a); const inSel = (c, r) => { const A = rc(sel.a), B = rc(sel.b); return c >= Math.min(A.c,B.c) && c <= Math.max(A.c,B.c) && r >= Math.min(A.r,B.r) && r <= Math.max(A.r,B.r); };
  function draw(){
    let html = '<tr><th class="corner"></th>' + Array.from({length:st.cols}, (_, i) => `<th>${XL.numToCol(i+1)}</th>`).join('') + '</tr>';
    for(let r=1; r<=st.rows; r++){ html += `<tr><th>${r}</th>`; for(let c=1; c<=st.cols; c++){ const a = XL.addr(c, r), v = sheet.value(a), raw = sheet.raw[a];
      const cls = [inSel(c, r) ? 'sel' : '', a === sel.a ? 'act' : '', typeof v === 'number' ? 'num' : '', XL.isErr(v) ? 'err' : '', typeof raw === 'string' && raw.startsWith('=') ? 'f' : '', r === 1 ? 'hdr' : '', sheet.spillOf && sheet.spillOf[a] && sheet.raw[a] === undefined ? 'spill' : ''].join(' ');
      html += `<td class="${cls}" data-a="${a}" title="${esc(raw ?? '')}">${esc(XL.fmt(v))}</td>`; } html += '</tr>'; }
    grid.innerHTML = html; nb.textContent = sel.a === sel.b ? sel.a : sel.a + ':' + sel.b; if(!editing) fx.value = sheet.raw[sel.a] ?? '';
  }
  const snap = () => { undo.push(JSON.stringify(sheet.raw)); if(undo.length > 50) undo.shift(); };
  function commit(v){ snap(); sheet.set(sel.a, v.trim() === '' ? '' : v.trim()); editing = false; }
  function move(dc, dr, extend){ const A = rc(extend ? sel.b : sel.a); const c = Math.min(Math.max(A.c + dc, 1), st.cols), r = Math.min(Math.max(A.r + dr, 1), st.rows); const n = XL.addr(c, r); if(extend) sel.b = n; else sel = {a:n, b:n}; draw(); }
  function fill(){ const A = rc(sel.a), B = rc(sel.b); const r0 = Math.min(A.r, B.r), r1 = Math.max(A.r, B.r), c0 = Math.min(A.c, B.c), c1 = Math.max(A.c, B.c);
    if(r0 === r1){ api.fail('Select a range first: click the top cell, then Shift+click the bottom cell.', true); return; }
    snap(); for(let c=c0; c<=c1; c++){ const top = sheet.raw[XL.addr(c, r0)] ?? ''; for(let r=r0+1; r<=r1; r++){ sheet.raw[XL.addr(c, r)] = typeof top === 'string' && top.startsWith('=') ? XL.shift(top, r - r0, 0) : top; if(top === '') delete sheet.raw[XL.addr(c, r)]; } }
    sheet.recalc(); draw(); toast('Filled down ⬇'); }
  grid.addEventListener('mousedown', e => { const td = e.target.closest('td'); if(!td) return; e.preventDefault();
    if(editing && fx.value.startsWith('=')){ // click-to-insert reference while typing a formula
      const p = fx.selectionStart ?? fx.value.length; fx.value = fx.value.slice(0, p) + td.dataset.a + fx.value.slice(p); fx.focus(); fx.setSelectionRange(p + td.dataset.a.length, p + td.dataset.a.length); return; }
    if(e.shiftKey) sel.b = td.dataset.a; else sel = {a:td.dataset.a, b:td.dataset.a}; editing = false; draw(); wrap.focus(); });
  grid.addEventListener('dblclick', e => { const td = e.target.closest('td'); if(!td) return; editing = true; fx.focus(); });
  wrap.addEventListener('keydown', e => {

    else if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z'){ e.preventDefault(); if(undo.length){ sheet.raw = JSON.parse(undo.pop()); sheet.recalc(); draw(); } }
    else if(e.key === 'Delete' || e.key === 'Backspace'){ e.preventDefault(); snap(); const A = rc(sel.a), B = rc(sel.b); for(let c=Math.min(A.c,B.c); c<=Math.max(A.c,B.c); c++) for(let r=Math.min(A.r,B.r); r<=Math.max(A.r,B.r); r++) delete sheet.raw[XL.addr(c, r)]; sheet.recalc(); draw(); }
    else if(e.key === 'Enter' || e.key === 'F2'){ e.preventDefault(); e.stopPropagation(); editing = true; fx.focus(); }
    else if(e.key.length === 1 && !e.ctrlKey && !e.metaKey){ e.preventDefault(); editing = true; fx.value = e.key; fx.focus(); }
  });
  fx.addEventListener('focus', () => { editing = true; });
  fx.addEventListener('keydown', e => { e.stopPropagation();
    if(e.key === 'Enter'){ e.preventDefault(); commit(fx.value); move(0, 1); wrap.focus(); }
    else if(e.key === 'Tab'){ e.preventDefault(); commit(fx.value); move(1, 0); wrap.focus(); }
    else if(e.key === 'Escape'){ editing = false; draw(); wrap.focus(); } });
  $$('.tb', body).forEach(b => b.onclick = () => { const a = b.dataset.a; if(a === 'fill') fill(); if(a === 'undo' && undo.length){ sheet.raw = JSON.parse(undo.pop()); sheet.recalc(); draw(); } if(a === 'reset'){ snap(); sheet.raw = {}; for(const k in st.cells) sheet.raw[k] = st.cells[k]; sheet.recalc(); draw(); } if(a === 'goal'){ const p = $('.gspanel', body); p.hidden = !p.hidden; if(!p.hidden){ $('#gsTo', body).focus(); return; } } wrap.focus(); });
  if(st.goalseek){ $$('.gspanel input', body).forEach(i => i.addEventListener('keydown', e => e.stopPropagation()));
    $('#gsGo', body).onclick = () => { const setA = $('#gsSet', body).value.trim().toUpperCase(), byA = $('#gsBy', body).value.trim().toUpperCase(), target = +$('#gsTo', body).value;
      if(!XL.parseRef(setA) || !XL.parseRef(byA) || isNaN(target) || $('#gsTo', body).value === ''){ api.fail('Fill in all three boxes: a cell, a number, a cell.', true); return; }
      if(!sheet.formulaOf(setA)){ api.fail(`${setA} must contain a formula that depends on ${byA}.`, true); return; }
      snap(); const f = x => { sheet.raw[byA] = String(x); sheet.recalc(); return +sheet.value(setA) - target; };
      let x0 = +sheet.value(byA) || 0, x1 = x0 + 1, f0 = f(x0), f1 = f(x1), ok = false;
      for(let k = 0; k < 60; k++){ if(Math.abs(f1) < 1e-7){ ok = true; break; } const d = f1 - f0; if(d === 0) break; const x2 = x1 - f1 * (x1 - x0) / d; x0 = x1; f0 = f1; x1 = x2; f1 = f(x1); }
      sheet.raw[byA] = String(+x1.toFixed(6)); sheet.recalc(); draw(); $('.gspanel', body).hidden = true; toast(ok || Math.abs(f1) < 1e-4 ? `🎯 Goal Seek found a solution: ${byA} = ${+x1.toFixed(4)}` : 'Goal Seek could not find an exact solution.'); }; }
  draw(); setTimeout(() => wrap.focus({preventScroll:true}), 50);
  return { check: () => { if(editing && fx.value !== (sheet.raw[sel.a] ?? '')) { commit(fx.value); draw(); } return st.check(sheet); }, solve: () => { snap(); for(const k in st.solution) sheet.raw[k] = st.solution[k]; sheet.recalc(); editing = false; draw(); }, hint: st.hint };
};
